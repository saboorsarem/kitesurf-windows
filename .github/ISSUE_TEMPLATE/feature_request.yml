name: Feature request
description: Propose a capability for the Windows client.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the client makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it behave? Note the CDP method it would rely on if you know it.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rendering / screencast
        - Input
        - Navigation / history
        - Console / debugging
        - Engine connection / Cloudflare Access
        - Packaging / CI
    validations:
      required: true
